{% extends 'base.html' %}
{% block title %}Chỉnh sửa Thể loại - VietNhatLiMS{% endblock %}
{% block page_title %}Chỉnh sửa: {{ category.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Tên thể loại <span class="text-danger">*</span></label>{{ form.name }}</div>
                    <div class="mb-3"><label class="form-label">Mô tả</label>{{ form.description }}</div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Lưu</button>
                        <a href="{% url 'catalog:category_manage' %}" class="btn btn-outline-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
